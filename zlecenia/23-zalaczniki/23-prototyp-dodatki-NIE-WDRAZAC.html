<!-- ===== PROTOTYP (tylko w artefakcie; do wdrożenia nie przenosić): przełącznik progu i makieta podstrony ===== -->
<style>
  .pr-chip { position: fixed; z-index: 90; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border: 1px solid rgb(255 255 255 / .28); border-radius: 999px;
    background: rgb(9 16 34 / .72); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; font: 600 12.5px/1 var(--f-text, system-ui, sans-serif);
    touch-action: none; cursor: pointer; }
  .pr-chip b { font-weight: 800; }
  .pr-chip:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .pr-dymek { position: fixed; z-index: 91; left: 50%; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; max-width: calc(100vw - 32px);
    padding: 9px 14px; border-radius: 8px; background: rgb(9 16 34 / .9); color: #fff; font: 500 13.5px/1.4 var(--f-text, system-ui, sans-serif); text-align: center;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  .pr-dymek.widoczny { opacity: 1; }
  .pr-strona { position: fixed; inset: 0; z-index: 95; display: flex; flex-direction: column; background: var(--bg, #f7f5f0); color: var(--ink, #111);
    touch-action: none; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
  .pr-strona[hidden] { display: none; }
  .pr-strona button { align-self: flex-start; padding: 10px 14px; border: 1px solid var(--line, #ccc); border-radius: 8px; background: transparent; color: inherit; font: 600 15px/1 var(--f-text, system-ui, sans-serif); cursor: pointer; }
  .pr-strona h2 { margin: 28px 0 8px; font: 500 30px/1.15 var(--f-display, Georgia, serif); }
  .pr-strona p { margin: 0; max-width: 34em; color: var(--muted, #555); font: 400 15px/1.5 var(--f-text, system-ui, sans-serif); }
</style>
<button type="button" class="pr-chip" id="pr-chip" aria-label="Prototyp: zmień próg przejścia">Prototyp · próg <b>1/3</b></button>
<div class="pr-dymek" id="pr-dymek" role="status"></div>
<div class="pr-strona" id="pr-strona" hidden role="dialog" aria-modal="true" aria-labelledby="pr-strona-h">
  <button type="button" id="pr-wstecz">← Wstecz</button>
  <h2 id="pr-strona-h">Podstrona</h2>
  <p>W prototypie linki nie prowadzą dalej. „Wstecz” wraca na stronę główną tam, skąd przyszło stuknięcie — tak ma działać prawdziwy powrót (zlecenie 23, punkt 2.7).</p>
</div>
<script>
(function () {
  var html = document.documentElement;
  // linki do strony głównej („./”) wskazują w prototypie ten sam adres co strona — wtedy działają jak na prawdziwej stronie (powrót na okładkę)
  var tu = location.pathname.replace(/[^/]*$/, '');
  document.querySelectorAll('a[href]').forEach(function (a) { try { var u = new URL(a.href); if (u.origin === location.origin && u.pathname === tu && !u.hash) a.setAttribute('href', location.pathname + location.search); } catch (e) {} });
  var progi = [[0.25, '1/4'], [1 / 3, '1/3'], [0.5, '1/2']], i = 1;
  try { var z = sessionStorage.getItem('pr-prog'); if (z !== null && progi[+z]) i = +z; } catch (e) {}
  var chip = document.getElementById('pr-chip'), dymek = document.getElementById('pr-dymek'), czas = 0;
  function powiedz(t) { dymek.textContent = t; dymek.classList.add('widoczny'); clearTimeout(czas); czas = setTimeout(function () { dymek.classList.remove('widoczny'); }, 2200); }
  function ustaw() { html.style.setProperty('--z-prog', String(progi[i][0])); chip.querySelector('b').textContent = progi[i][1]; }
  ustaw();
  chip.addEventListener('click', function () {
    i = (i + 1) % progi.length; ustaw();
    try { sessionStorage.setItem('pr-prog', String(i)); } catch (e) {}
    powiedz('Próg: ' + progi[i][1] + ' wysokości ekranu');
  });
  setTimeout(function () { if (!html.classList.contains('bez-okladki')) powiedz(matchMedia('(hover: none) and (pointer: coarse)').matches ? 'Pociągnij okładkę w górę, aby przejść do Szybkiego dostępu' : 'Przewiń kółkiem w dół, aby przejść do Szybkiego dostępu'); }, 900);
  // linki: makieta podstrony zamiast przejścia (strona główna obsługuje swoje linki wcześniej i je zatrzymuje)
  var strona = document.getElementById('pr-strona');
  window.addEventListener('click', function (e) {
    if (e.defaultPrevented) return;
    var a = e.target instanceof Element ? e.target.closest('a[href]') : null;
    if (!a || a.closest('.pr-strona')) return;
    var h = a.getAttribute('href') || '';
    if (h.charAt(0) === '#') return;
    e.preventDefault();
    document.getElementById('pr-strona-h').textContent = (a.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Podstrona';
    strona.hidden = false; document.getElementById('pr-wstecz').focus();
  });
  document.getElementById('pr-wstecz').addEventListener('click', function () { strona.hidden = true; });
})();
</script>
