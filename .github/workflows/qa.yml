name: Kontrola jakości

# Automatyczna kontrola jakości strony: linki (lychee) i dostępność (pa11y-ci: axe + HTML_CodeSniffer).
# NICZEGO NIE PUBLIKUJE na GitHub Pages.
#
# Uruchamianie:
#   - push na gałąź qa-*  (np. `git checkout -b qa-2 origin/main && git push -u origin qa-2`),
#   - ręcznie: Actions → „Kontrola jakości” → Run workflow,
#   - automatycznie raz w tygodniu (gałąź main).
# Wyniki: adnotacje przebiegu (`gh run view <id>`), podsumowanie przebiegu (Summary),
# a na gałęziach qa-* dodatkowo pełny raport w pliku qa/raport.md dopisywany do tej gałęzi.
# Błąd krytyczny (czerwony przebieg) = zepsuty link wewnętrzny. Linki zewnętrzne, linki do starej
# strony i problemy dostępności to ostrzeżenia/informacje. Skrypt: .github/qa/qa.py

on:
  push:
    branches: ['qa-*']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # poniedziałki 5:17 UTC

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  QA_ORIGIN: http://localhost:8080
  QA_OUT: qa-wyniki

jobs:
  qa:
    name: Linki i dostępność
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Treści z repozytoriów IM-UWr/Web-*
        run: python3 skrypty/pobierz_tresci.py

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalacja zależności
        run: npm install --no-audit --no-fund

      # Ścieżka bazowa „/” (BASE_PATH=''), adres strony = lokalny serwer testowy.
      - name: Budowanie strony
        env:
          BASE_PATH: ''
          SITE_URL: http://localhost:8080
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            msg=$(tail -c 6000 build.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Błąd budowania::${msg}"
            exit 1
          fi
          echo "::notice title=Budowanie::$(find dist -name '*.html' | wc -l) plików HTML, $(du -sh dist | cut -f1)"

      - name: Indeks linków i wybór stron do testów
        run: python3 .github/qa/qa.py indeks

      # (a) Linki wewnętrzne — pliki w dist/, bez sieci.
      - name: Linki wewnętrzne — lychee
        id: lychee_wewn
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          format: json
          output: qa-wyniki/lychee-wewnetrzne.json
          fail: false
          failIfEmpty: false
          jobSummary: false

      - name: Linki wewnętrzne — wynik
        env:
          LYCHEE_KOD: ${{ steps.lychee_wewn.outputs.exit_code }}
        run: python3 .github/qa/qa.py wewnetrzne

      # (b) Linki zewnętrzne — unikalne adresy zebrane przez skrypt (plik qa-wyniki/zewnetrzne.html).
      # --insecure: serwer starej strony ma niepełny łańcuch certyfikatów (przeglądarki go uzupełniają),
      # a tu sprawdzamy, czy adres istnieje. 403/429/3xx/5xx/timeout = „nie wiadomo”, nie błąd.
      - name: Linki zewnętrzne — lychee
        id: lychee_zewn
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 16
            --timeout 25
            --max-retries 2
            --retry-wait-time 4
            --insecure
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36'
            qa-wyniki/zewnetrzne.html
          format: json
          output: qa-wyniki/lychee-zewnetrzne.json
          fail: false
          failIfEmpty: false
          jobSummary: false

      - name: Linki zewnętrzne — wynik
        env:
          LYCHEE_KOD: ${{ steps.lychee_zewn.outputs.exit_code }}
        run: python3 .github/qa/qa.py zewnetrzne

      # (c) Linki do starej strony math.uni.wroc.pl — „dług migracyjny”.
      - name: Linki do starej strony
        run: python3 .github/qa/qa.py stara

      - name: Dostępność — instalacja pa11y-ci
        run: npm install --prefix "$RUNNER_TEMP/pa11y" --no-audit --no-fund --no-save pa11y-ci@4

      - name: Dostępność — pa11y-ci
        run: |
          python3 -m http.server 8080 --directory dist > "$RUNNER_TEMP/serwer.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:8080/ && break; sleep 1; done
          "$RUNNER_TEMP/pa11y/node_modules/.bin/pa11y-ci" --config qa-wyniki/pa11y.json > qa-wyniki/pa11y-log.txt 2>&1 || true
          # Kolory i współczynniki dla zgłoszeń color-contrast (pa11y podaje sam komunikat).
          PA11Y_DIR="$RUNNER_TEMP/pa11y" node .github/qa/kontrast.cjs >> qa-wyniki/pa11y-log.txt 2>&1 || true

      - name: Dostępność — wynik
        run: python3 .github/qa/qa.py dostepnosc

      - name: Raport
        if: ${{ !cancelled() }}
        run: python3 .github/qa/qa.py raport

      - name: Zachowanie wyników
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-wyniki
          path: qa-wyniki/
          retention-days: 14
          if-no-files-found: ignore

  # Pełny raport do repozytorium — WYŁĄCZNIE na gałęziach qa-* (nigdy na main).
  zapis-raportu:
    name: Zapis raportu na gałęzi qa-*
    needs: qa
    if: ${{ !cancelled() && github.ref_type == 'branch' && startsWith(github.ref_name, 'qa-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v5
        with:
          name: qa-wyniki
          path: ${{ runner.temp }}/qa-wyniki

      - name: Commit qa/raport.md
        env:
          GALAZ: ${{ github.ref_name }}
        run: |
          case "$GALAZ" in qa-*) ;; *) echo "::error::Zapis raportu dozwolony tylko na gałęziach qa-*"; exit 1;; esac
          W="$RUNNER_TEMP/qa-wyniki"
          if [ ! -f "$W/raport.md" ]; then echo "::warning title=Zapis raportu::Brak raportu do zapisania"; exit 0; fi
          mkdir -p qa/dane
          cp "$W/raport.md" qa/raport.md
          for f in wynik-wewnetrzne.json wynik-zewnetrzne.json wynik-stara.json wynik-dostepnosc.json \
                   lychee-zewnetrzne.json pa11y-wyniki.json pa11y.json pa11y-log.txt kontrast.json; do
            if [ -f "$W/$f" ]; then cp "$W/$f" "qa/dane/$f"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add qa
          if git diff --cached --quiet; then echo "Bez zmian w raporcie"; exit 0; fi
          git commit -q -m "Raport kontroli jakości (przebieg ${GITHUB_RUN_ID}) [skip ci]"
          for i in 1 2 3; do
            git push origin "HEAD:refs/heads/${GALAZ}" && exit 0
            git pull --rebase -q origin "$GALAZ" || true
          done
          echo "::warning title=Zapis raportu::Nie udało się wypchnąć raportu na ${GALAZ}"
