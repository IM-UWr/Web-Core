name: Plan zajęć z USOS

# Pobiera plan zajęć z USOS (anonimowo — bez klucza API i bez logowania) do src/data/plan/plan.json.
# Gdy plan się zmienił, commituje plik na gałąź, na której działa przebieg:
#  - main (harmonogram / ręczne uruchomienie): po commicie zleca przebudowę strony (repository_dispatch
#    „przebuduj” — commit zrobiony tokenem GITHUB_TOKEN sam nie uruchamia innych workflowów);
#  - gałąź robocza, na której zmieniono skrypt: próbne pobranie zapisane na tej gałęzi.
on:
  schedule:
    # 3 razy dziennie (czas UTC; w Polsce +1/+2 h), przed porannym i popołudniowym budowaniem strony
    - cron: '47 1 * * *'
    - cron: '37 9 * * *'
    - cron: '47 15 * * *'
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'skrypty/plan/**'
      - '.github/workflows/plan-zajec.yml'

permissions:
  contents: write

concurrency:
  group: plan-zajec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Pobranie planu z USOS
        run: python3 skrypty/plan/pobierz_plan.py

      - name: Zapis zmian
        env:
          GH_TOKEN: ${{ github.token }}
          GALAZ: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- src/data/plan/plan.json && [ -z "$(git status --porcelain -- src/data/plan/plan.json)" ]; then
            echo "::notice title=Plan zajęć::Bez zmian w USOS — nic do zapisania."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/plan/plan.json
          git commit -m "Plan zajęć: aktualizacja z USOS"
          for i in 1 2 3; do
            if git push origin "HEAD:$GALAZ"; then break; fi
            git pull --rebase origin "$GALAZ"
          done
          if [ "$GALAZ" = "main" ]; then
            gh api "repos/${{ github.repository }}/dispatches" -f event_type=przebuduj \
              || echo "::warning title=Plan zajęć::Nie udało się zlecić przebudowy — strona odświeży się przy najbliższym planowym budowaniu."
          fi
          echo "::notice title=Plan zajęć::Zapisano nowy plan na gałęzi $GALAZ."
